<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Switch | Try Galaxy Demo</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/smartswitch.css" />
  <link rel="stylesheet" href="../assets/css/intro.css" />
</head>
<body>
  <div class="app-frame">
    <div class="experience-page">
      <section class="screen intro-layout" id="screen-intro">
        <h1>Smart Switch</h1>
        <p class="hint">Tap the screen to step through the iOS and Galaxy Smart Switch screens.</p>
        <div class="intro-cards intro-cards--single">
          <div class="intro-card"></div>
        </div>
        <button class="btn btn-primary intro-try-lg" id="startBtn" type="button">Try now</button>
        <a class="back-link" href="../index.html?from=experience">← Back to home</a>
      </section>
    </div>

    <section class="screen splitview-screen" id="screen-splitview" hidden>
      <button class="splitview-back" id="closeSplitBtn" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>

      <div class="stage" id="stage">
        <div class="panel panel--top" data-role="active" id="panelTop">
          <div class="ss-device">
            <span class="ss-pill">Your Phone</span>
            <span class="ss-device-name">iPhone</span>
            <div class="ss-frame ios">
              <div class="ss-screen">
                <img id="imgTop" src="../assets/img/smartswitch/ios/1.png" alt="iOS screen 1" />
                <span class="ss-hotspot" id="ssHotspot" hidden></span>
              </div>
            <img class="ss-frame-img" src="../assets/img/smartswitch/frame-ios.png" alt="" />
            </div>
          </div>
        </div>
        <div class="panel panel--bottom" data-role="rest" id="panelBottom">
          <div class="ss-device">
            <span class="ss-pill">New Phone</span>
            <span class="ss-device-name">Galaxy S00</span>
            <div class="ss-frame galaxy">
              <div class="ss-screen">
                <img id="imgBottom" src="../assets/img/smartswitch/galaxy/1.png" alt="Galaxy screen 1" />
                <span class="ss-hotspot" id="ssHotspotB" hidden></span>
              </div>
            <img class="ss-frame-img" src="../assets/img/smartswitch/frame-android.png" alt="" />
            </div>
          </div>
        </div>

        <div class="ss-connector" id="ssConnector" hidden>
          <div class="ssc-dots"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i></div>
        </div>

        <div class="ss-resize-handle" id="ssResizeHandle" aria-label="Drag to resize the two screens"></div>
      </div>

      <div class="qr-scan-layer" id="qrScanLayer"></div>

      <!-- 모든 화면이 끝나면 오른쪽 아래에 나타나는 시나리오 전환 버튼 -->
      <button class="ss-next-btn" id="ssNextBtn" hidden></button>

      <!-- 시작 인트로: 기기 감지 로딩 → iPhone 화면 → 두 화면으로 분할 -->
      <div class="ss-intro" id="ssIntro" data-phase="detect" hidden>
        <p class="ss-intro-title" id="ssIntroTitle">Detecting your phone...</p>
        <div class="ss-intro-device">
          <div class="ss-device">
            <span class="ss-pill">Your Phone</span>
            <span class="ss-device-name">iPhone</span>
            <div class="ss-frame ios">
              <div class="ss-screen">
                <img src="../assets/img/smartswitch/ios/1.png" alt="iOS screen" />
              </div>
            
              <div class="ss-skeleton" aria-hidden="true">
                <div class="sk-screen">
                  <span class="sk-island"></span>
                  <div class="sk-grid"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                  <span class="sk-dock"></span>
                </div>
              </div>
            <img class="ss-frame-img" src="../assets/img/smartswitch/frame-ios.png" alt="" />
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const el = (id) => document.getElementById(id);

    function showScreen(id){
      document.querySelectorAll(".screen").forEach(s => s.hidden = (s.id !== id));
    }

    const stage = el("stage");
    const nextBtn = el("ssNextBtn");
    const panelTop = el("panelTop");
    const panelBottom = el("panelBottom");
    const imgTop = el("imgTop");
    const imgBottom = el("imgBottom");

    // 시나리오 정의: 폴더에 실제로 존재하는 번호만 적어둠
    const IMG = "../assets/img/smartswitch/";
    const QS_IMG = "../assets/img/QuickShare/";
    const SCENARIOS = {
      i2g: {
        intro: "You are using iPhone!",
        top: { pill: "Your Phone", name: "iPhone", frameClass: "ios", frame: IMG + "frame-ios.png", folder: IMG + "ios", ext: "png", nums: [1, 2, 3, 4, 5, 6, 7, 9, 14] },
        bottom: { pill: "New Phone", name: "Galaxy S00", frameClass: "galaxy", frame: IMG + "frame-android.png", folder: IMG + "galaxy", ext: "png", nums: [1, 2, 4, 5, 7, 8, 9, 10, 11, 12, 13, 14] },
        qrStep: 5,          // 양쪽이 이 번호에 도달하면 QR 스캔 연출
        burstSide: "top",
        burstStep: 7,       // burstSide 쪽이 이 번호가 되는 순간 연결 완료 연출
        connectorFrom: 7,   // 위쪽이 이 번호부터 두 기기 사이 연결 표시
        transferFrom: 9,    // 위쪽이 이 번호부터 전송 연출 시작
        transferStopBottom: 11, // 아래쪽이 이 번호가 되면 전송 연출 종료
        next: { key: "g2g", label: "Galaxy to Galaxy" },
      },
      g2g: {
        intro: "You are using Galaxy!",
        top: { pill: "Your Phone", name: "Galaxy S24", frameClass: "galaxy", frame: IMG + "frame-android.png", folder: IMG + "g2g-sender", ext: "jpg", nums: [1, 2, 4, 5, 6, 10, 13] },
        bottom: { pill: "New Phone", name: "Galaxy S00", frameClass: "galaxy", frame: IMG + "frame-android.png", folder: IMG + "g2g-receiver", ext: "jpg", nums: [1, 2, 3, 4, 5, 7, 8, 9, 10, 11, 12, 13] },
        qrStep: 4,          // Sender 4(QR 스캔 안내) · Receiver 4(QR 표시)
        burstSide: "top",
        burstStep: 6,       // Sender 6(연결 완료)
        connectorFrom: 6,
        transferFrom: 10,   // Sender 10(전송 중)
        transferStopBottom: 11, // Receiver 11(데이터 정리 중)
        next: { key: "i2g", label: "iOS to Galaxy" },
      },
      // Quick Share (no detection intro). Step numbers follow the asset file names; hotspots are keyed by the step reached
      // (side = which screen holds the tap target, x/y/d in original image pixels).
      // g2i: Galaxy sends (top), iOS receives (bottom)
      qsg2i: {
        intro: null,
        top: { pill: "Galaxy", frameClass: "galaxy", frame: IMG + "frame-android.png", folder: QS_IMG + "G2I", prefix: "Galaxy ", ext: "png", nums: [1, 2] },
        bottom: { pill: "iOS", frameClass: "ios", frame: IMG + "frame-ios.png", folder: QS_IMG + "G2I", prefix: "iOS ", ext: "png", nums: [1, 3, 4, 5, 6, 7] },
        hotspots: {
          2: { side: "top", x: 152, y: 215, d: 46 },     // 3rd device (iPhone) in Galaxy share list
          4: { side: "bottom", x: 186, y: 118, d: 50 },  // AirDrop "Accept"
        },
        startActive: "top",
        sendPhoto: IMG + "qs-photo.jpg",
        sendStep: 3,          // photo flies out of Galaxy when iOS first acts
        qrStep: Infinity,
        burstSide: "bottom",
        burstStep: 6,         // AirDrop Complete
        connectorFrom: Infinity,
        transferFrom: Infinity,
        transferStopBottom: Infinity,
        next: { key: "qsi2g", label: "iOS to Galaxy" },
      },
      // i2g: iOS sends (top), Galaxy receives (bottom) — Galaxy acts first (steps 2-3), then iOS taps the device (step 4)
      qsi2g: {
        intro: null,
        top: { pill: "iOS", frameClass: "ios", frame: IMG + "frame-ios.png", folder: QS_IMG + "i2G", prefix: "iOS ", ext: "png", nums: [1, 4] },
        bottom: { pill: "Galaxy", frameClass: "galaxy", frame: IMG + "frame-android.png", folder: QS_IMG + "i2G", prefix: "Galaxy ", ext: "png", nums: [1, 2, 3, 4, 5, 6, 7] },
        hotspots: {
          1: { side: "bottom", x: 222, y: 18, d: 40 },   // status bar: swipe down for quick panel
          2: { side: "bottom", x: 104, y: 340, d: 56 },  // Quick Share tile
          // step 4: iOS acts first (3rd device appears) -> tap it -> photo flies -> Galaxy "wants to share" -> "Accept"
          // an array entry is picked by `when` = the side that acted last
          4: [
            { when: "top", side: "top", x: 168, y: 142, d: 52, whileQueued: true },  // 3rd device (Galaxy S00) in AirDrop sheet
            { when: "bottom", side: "bottom", x: 180, y: 415, d: 52 },               // "Accept"
          ],
          6: { side: "bottom", x: 180, y: 415, d: 52 },  // "Open"
        },
        startActive: "bottom",
        sendPhoto: IMG + "qs-photo.jpg",
        sendStep: 4,          // photo flies out of iOS when Galaxy then shows "wants to share"
        qrStep: Infinity,
        burstSide: "bottom",
        burstStep: 6,         // image received
        connectorFrom: Infinity,
        transferFrom: Infinity,
        transferStopBottom: Infinity,
        next: { key: "qsg2i", label: "Galaxy to iOS" },
      },
    };

    let SC = SCENARIOS.i2g;
    let AVAILABLE = { top: SC.top, bottom: SC.bottom };
    let MAX_STEP = Math.max(...SC.top.nums, ...SC.bottom.nums);

    const imgSrc = (side, n) => encodeURI(`${AVAILABLE[side].folder}/${AVAILABLE[side].prefix || ""}${n}.${AVAILABLE[side].ext}`);

    /* Hotspots: blue circle on the tap target for the step just reached (SC.hotspots[step]); hidden while a step still has pending actions */
    const hotspotTop = el("ssHotspot");
    const hotspotBottom = el("ssHotspotB");
    const hotspot = hotspotTop;

    function hideHotspots(){ hotspotTop.hidden = hotspotBottom.hidden = true; }

    function updateHotspot(){
      hideHotspots();
      let hs = SC.hotspots ? SC.hotspots[step] : null;
      if (Array.isArray(hs)) hs = hs.find((h) => !h.when || h.when === active) || null;
      if (!hs || (queue.length > 0 && !hs.whileQueued)) return;
      const img = hs.side === "top" ? imgTop : imgBottom;
      const spot = hs.side === "top" ? hotspotTop : hotspotBottom;
      const nw = img.naturalWidth, nh = img.naturalHeight;
      if (!nw || !img.complete) return;
      const box = spot.parentElement;
      const w = box.clientWidth, h = box.clientHeight;
      // screen images use object-fit: cover, so map the coordinates the same way
      const sc = Math.max(w / nw, h / nh);
      const ox = (w - nw * sc) / 2, oy = (h - nh * sc) / 2;
      const size = hs.d * sc;
      spot.style.width = spot.style.height = size + "px";
      spot.style.left = (hs.x * sc + ox - size / 2) + "px";
      spot.style.top = (hs.y * sc + oy - size / 2) + "px";
      spot.hidden = false;
      // If the tap target is on the zoomed-out phone, bring that phone into focus (after the previous screen has settled)
      if (hs.side !== active) {
        const forStep = step;
        setTimeout(() => {
          if (step !== forStep || queue.length !== 0 || effectBusy) return;
          active = hs.side;
          panelTop.dataset.role = active === "top" ? "active" : "rest";
          panelBottom.dataset.role = active === "bottom" ? "active" : "rest";
          setSplitRatio(active === "top" ? 66.667 : 33.333);
          layoutSettleUntil = performance.now() + 750;
          updateHotspot(); // re-measure after the resize
        }, 800);
      }
    }

    imgTop.addEventListener("load", updateHotspot);
    imgBottom.addEventListener("load", updateHotspot);

    function applyScenario(key){
      SC = SCENARIOS[key];
      AVAILABLE = { top: SC.top, bottom: SC.bottom };
      MAX_STEP = Math.max(...SC.top.nums, ...SC.bottom.nums);

      [["top", panelTop], ["bottom", panelBottom]].forEach(([side, panel]) => {
        const cfg = SC[side];
        panel.querySelector(".ss-pill").textContent = cfg.pill;
        panel.querySelector(".ss-device-name").textContent = cfg.name || "";
        panel.querySelector(".ss-frame").className = "ss-frame " + cfg.frameClass;
        panel.querySelector(".ss-frame-img").src = cfg.frame;
      });

      // 인트로에 보이는 폰은 위쪽(첫 번째) 기기와 동일
      const introFrame = intro.querySelector(".ss-frame");
      introFrame.className = "ss-frame " + SC.top.frameClass;
      introFrame.querySelector(".ss-frame-img").src = SC.top.frame;
      intro.querySelector(".ss-pill").textContent = SC.top.pill;
      intro.querySelector(".ss-device-name").textContent = SC.top.name || "";
      intro.querySelector(".ss-screen img").src = imgSrc("top", 1);
    }

    let step = 1;
    let active = "top";
    let shown = { top: 1, bottom: 1 };
    // 현재 번호에서 아직 처리 못한 쪽들 — 양쪽 다 있으면 위쪽 먼저 → 아래쪽 순으로 한 탭씩 소비
    let queue = [];

    function queueForStep(n){
      const q = [];
      if (AVAILABLE.top.nums.includes(n)) q.push("top");
      if (AVAILABLE.bottom.nums.includes(n)) q.push("bottom");
      return q;
    }

    /* 위 패널 비율(%) — 탭하면 66.667/33.333으로 스냅되고, 핸들을 드래그하면 자유롭게 바뀐다 */
    const MIN_RATIO = 18;
    const MAX_RATIO = 82;

    function setSplitRatio(topPercent){
      const p = Math.max(MIN_RATIO, Math.min(MAX_RATIO, topPercent));
      panelTop.style.flexBasis = p + "%";
      panelBottom.style.flexBasis = (100 - p) + "%";
      el("ssConnector").style.top = p + "%";
      el("ssResizeHandle").style.top = p + "%";
      return p;
    }

    /* 드래그 중 비율에 비례해 폰 크기·배경·pill 색을 연속적으로 보간 (탭 시 active/rest 상태와 동일한 양 끝값 사용) */
    const REST_SCALE = 0.55;
    const ACTIVE_SCALE = 1.4;
    const COLOR = {
      background: [255, 255, 255],
      muted: [245, 245, 245],
      foreground: [10, 10, 10],
      mutedForeground: [115, 115, 115],
    };
    const lerp = (a, b, t) => a + (b - a) * t;
    const lerpColor = (c1, c2, t) =>
      `rgb(${Math.round(lerp(c1[0], c2[0], t))}, ${Math.round(lerp(c1[1], c2[1], t))}, ${Math.round(lerp(c1[2], c2[2], t))})`;

    function applyDragVisual(topPercent){
      const tTop = (topPercent - MIN_RATIO) / (MAX_RATIO - MIN_RATIO);
      const tBottom = 1 - tTop;

      [{ panel: panelTop, t: tTop }, { panel: panelBottom, t: tBottom }].forEach(({ panel, t }) => {
        panel.querySelector(".ss-device").style.transform = `scale(${lerp(REST_SCALE, ACTIVE_SCALE, t)})`;
        panel.style.backgroundColor = lerpColor(COLOR.muted, COLOR.background, t);
        const pill = panel.querySelector(".ss-pill");
        pill.style.backgroundColor = lerpColor(COLOR.muted, COLOR.foreground, t);
        pill.style.color = lerpColor(COLOR.mutedForeground, COLOR.background, t);
      });
    }

    function clearDragOverrides(){
      [panelTop, panelBottom].forEach((panel) => {
        panel.style.backgroundColor = "";
        panel.querySelector(".ss-device").style.transform = "";
        const pill = panel.querySelector(".ss-pill");
        pill.style.backgroundColor = "";
        pill.style.color = "";
      });
    }

    let hasPlayedQrAnim = false;

    function applyAction(side){
      // 폰 크기·위치가 바뀌므로(620ms 전환) 날아가던 전송 아이콘은 정리하고 전환이 끝난 뒤 다시 생성
      layoutSettleUntil = performance.now() + 750;
      cancelFlights(true);
      active = side;
      shown[side] = step;
      hideHotspots(); // re-shown by updateHotspot() once the new image has loaded
      (side === "top" ? imgTop : imgBottom).src = imgSrc(side, step);

      clearDragOverrides();
      panelTop.dataset.role = active === "top" ? "active" : "rest";
      panelBottom.dataset.role = active === "bottom" ? "active" : "rest";
      setSplitRatio(active === "top" ? 66.667 : 33.333);

      updateHotspot();

      // iOS·Galaxy 둘 다 "화면 5"(QR 스캔 단계)에 도달하면 위 패널의 폰이 아래로 튀어나와 QR을 찍어가는 연출 재생
      if (!hasPlayedQrAnim && shown.top === SC.qrStep && shown.bottom === SC.qrStep) {
        hasPlayedQrAnim = true;
        setTimeout(playQrScanAnimation, 650); // 패널 리사이즈 트랜지션(620ms)이 끝난 뒤 위치를 측정
      }

      // iOS 화면 6 → 7(연결 완료) 전환: 폰이 5% 작아졌다가 커지며 완료되는 느낌의 바운스
      if (side === SC.burstSide && step === SC.burstStep) {
        const burstPanel = side === "top" ? panelTop : panelBottom;
        const frame = burstPanel.querySelector(".ss-frame");
        frame.animate([
          { transform: "scale(1)" },
          { transform: "scale(0.95)", offset: 0.35 },
          { transform: "scale(1.08)", offset: 0.65 },
          { transform: "scale(1)" },
        ], { duration: 650, easing: "cubic-bezier(.34,1.56,.64,1)" });

        // 완료 순간 폰 뒤에서 파란 원이 커지며 사라지는 버스트
        const burst = document.createElement("div");
        burst.className = "ss-success-burst";
        burstPanel.insertBefore(burst, burstPanel.firstChild);
        const burstAnim = burst.animate([
          { transform: "scale(0.3)", opacity: 0.55 },
          { transform: "scale(2.4)", opacity: 0 },
        ], { duration: 700, delay: 150, easing: "ease-out" });
        burstAnim.onfinish = () => burst.remove();
      }

      // 연결 완료 이후로는 두 기기 사이에 데이터가 오가는 연결 표시를 계속 보여줌
      if (shown.top >= SC.connectorFrom) {
        const connector = el("ssConnector");
        if (connector.hidden) {
          // 처음 연결되는 순간: 점들이 위에서 아래로 한 번 차례로 켜지며 이어짐
          connector.hidden = false;
          stage.classList.add("is-connected");
          connector.classList.remove("is-connecting");
          void connector.offsetWidth;
          connector.classList.add("is-connecting");
        }
      }

      // iOS 화면 9(전송 중)부터 갤럭시 화면 11(전송 완료)이 되기 전까지: 파란 점선 + 아이콘이 내려가는 연출
      if (shown.bottom >= SC.transferStopBottom) {
        stopTransferEffect();
      } else if (shown.top >= SC.transferFrom) {
        startTransferEffect();
      }
    }

    let transferEffectOn = false;
    let transferIntervalId = null;

    /* Smart Switch 데이터 전송: 파일·데이터·이미지·영상 아이콘이 보내는 폰에서 튀어나와 받는 폰 뒤로 들어감 */
    const DATA_ICONS = [
      // 파일(문서)
      '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
      // 데이터(데이터베이스)
      '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
      // 이미지
      '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/>',
      // 영상
      '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/>',
    ];
    let dataIconIdx = 0;
    let layoutSettleUntil = 0;

    function spawnDataFlyer(){
      // 폰 크기·위치가 바뀌는 중에는 도착 지점이 흔들리므로 레이아웃이 안정된 뒤에만 생성
      if (performance.now() < layoutSettleUntil) return;
      if ([...flights].filter((f) => f.stream).length >= 3) return;
      const senderFrame = panelTop.querySelector(".ss-frame");
      const icon = DATA_ICONS[dataIconIdx++ % DATA_ICONS.length];
      launchFlyer({
        fromRect: senderFrame.getBoundingClientRect(),
        size: 40,
        duration: 2400,
        stream: true,
        decorate: (node) => {
          node.classList.add("ss-data-chip");
          node.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>`;
        },
      });
    }

    function startTransferEffect(){
      if (transferEffectOn) return;
      transferEffectOn = true;
      el("ssConnector").classList.add("is-transferring");
      stage.classList.add("is-xfer");
      transferIntervalId = setInterval(spawnDataFlyer, 800);
    }

    function stopTransferEffect(){
      transferEffectOn = false;
      el("ssConnector").classList.remove("is-transferring");
      stage.classList.remove("is-xfer");
      if (transferIntervalId) { clearInterval(transferIntervalId); transferIntervalId = null; }
      cancelFlights(true);
    }

    /* 시작 인트로: Detecting... → You are using iPhone! → 레이아웃이 두 개로 분리 */
    const intro = el("ssIntro");
    const introTitle = el("ssIntroTitle");
    let introActive = false;
    let introTimers = [];

    function introLater(fn, ms){ introTimers.push(setTimeout(fn, ms)); }

    function cancelIntro(){
      introTimers.forEach(clearTimeout);
      introTimers = [];
      introActive = false;
      intro.hidden = true;
      intro.style.opacity = "";
      stage.classList.remove("is-intro");
    }

    function playIntro(){
      introActive = true;
      stage.classList.add("is-intro");
      // 분리 전: iOS 패널이 화면 전체를 차지하고 Galaxy 패널은 접혀 있음
      panelTop.style.flexBasis = "100%";
      panelBottom.style.flexBasis = "0%";
      el("ssConnector").style.top = "100%";
      intro.dataset.phase = "detect";
      introTitle.textContent = "Detecting your phone...";
      intro.style.opacity = "1";
      intro.hidden = false;

      introLater(() => {
        intro.dataset.phase = "found";
        introTitle.textContent = SC.intro;
      }, 1900);

      introLater(() => {
        stage.classList.remove("is-intro");
        setSplitRatio(66.667);          // 620ms 트랜지션으로 위/아래 두 개로 분리
        intro.style.opacity = "0";
      }, 3900);

      introLater(() => {
        intro.hidden = true;
        intro.style.opacity = "";
        introActive = false;
      }, 4600);
    }

    function resetSplitview(){
      cancelIntro();
      cancelFlights();
      effectBusy = false;
      el("qrScanLayer").innerHTML = "";
      step = 1;
      active = "top";
      shown = { top: 1, bottom: 1 };
      queue = [];
      hasPlayedQrAnim = false;
      clearDragOverrides();
      stopTransferEffect();
      el("qrScanLayer").innerHTML = "";
      el("ssConnector").hidden = true;
      el("ssConnector").classList.remove("is-connecting");
      stage.classList.remove("is-connected", "is-xfer");
      [panelTop, panelBottom].forEach((p) => p.querySelectorAll(".ss-success-burst").forEach((n) => n.remove()));
      panelTop.querySelector(".ss-frame").style.visibility = "";
      imgTop.src = imgSrc("top", 1);
      imgBottom.src = imgSrc("bottom", 1);
      nextBtn.hidden = true;
      hideHotspots();
      updateHotspot();
      const first = SC.startActive || "top";
      active = first;
      panelTop.dataset.role = first === "top" ? "active" : "rest";
      panelBottom.dataset.role = first === "bottom" ? "active" : "rest";
      setSplitRatio(first === "top" ? 66.667 : 33.333);
    }

    /* 위 패널의 폰이 튀어나와 아래 패널의 QR코드를 찍고 돌아오는 연출 */
    function playQrScanAnimation(){
      const sourceFrame = panelTop.querySelector(".ss-frame");
      const targetFrame = panelBottom.querySelector(".ss-frame");
      const layer = el("qrScanLayer");
      if (!sourceFrame || !targetFrame || !layer) return;

      const layerRect = layer.getBoundingClientRect();
      const startRect = sourceFrame.getBoundingClientRect();
      const targetRect = targetFrame.getBoundingClientRect();

      const startX = startRect.left - layerRect.left;
      const startY = startRect.top - layerRect.top;
      // QR코드는 보통 화면 중앙보다 약간 아래쪽에 있음
      const targetCenterX = (targetRect.left - layerRect.left) + targetRect.width / 2;
      const targetCenterY = (targetRect.top - layerRect.top) + targetRect.height * 0.62;

      const startScale = 0.6;
      const peakScale = 0.85;
      const dx = targetCenterX - (startX + (startRect.width * startScale) / 2);
      const dy = targetCenterY - (startY + (startRect.height * startScale) / 2);

      const clone = sourceFrame.cloneNode(true);
      clone.classList.add("qr-flying-frame");
      clone.style.left = startX + "px";
      clone.style.top = startY + "px";
      layer.appendChild(clone);
      sourceFrame.style.visibility = "hidden";

      const anim = clone.animate([
        { transform: `translate(0px, 0px) rotate(0deg) scale(${startScale})`, offset: 0 },
        { transform: `translate(${dx * 0.9}px, ${dy * 0.9}px) rotate(-12deg) scale(${peakScale})`, offset: 0.42 },
        { transform: `translate(${dx}px, ${dy}px) rotate(-8deg) scale(${peakScale})`, offset: 0.5 },
        { transform: `translate(${dx}px, ${dy}px) rotate(-8deg) scale(${peakScale * 1.06})`, offset: 0.62 },
        { transform: `translate(${dx}px, ${dy}px) rotate(-8deg) scale(${peakScale})`, offset: 0.74 },
        { transform: `translate(0px, 0px) rotate(0deg) scale(${startScale})`, offset: 1 },
      ], { duration: 1900, easing: "cubic-bezier(.22,.61,.36,1)" });

      // 폰이 도착하는 타이밍에 QR 지점에서 스캔 플래시(펄스 링) 표시
      setTimeout(() => {
        const pulse = document.createElement("div");
        pulse.className = "qr-scan-pulse";
        pulse.style.left = targetCenterX + "px";
        pulse.style.top = targetCenterY + "px";
        layer.appendChild(pulse);
        const pulseAnim = pulse.animate([
          { transform: "scale(0.4)", opacity: 0.9 },
          { transform: "scale(1.6)", opacity: 0 },
        ], { duration: 650, easing: "ease-out" });
        pulseAnim.onfinish = () => pulse.remove();
      }, 1900 * 0.5);

      anim.onfinish = () => {
        clone.remove();
        sourceFrame.style.visibility = "";
      };
    }

    stage.addEventListener("click", () => {
      if (introActive || effectBusy) return;
      // 현재 번호에 남은 처리가 없으면, 다음 번호로 넘어가서 큐를 새로 만든다
      while (queue.length === 0) {
        if (step >= MAX_STEP) return;
        step += 1;
        queue = queueForStep(step);
      }
      const side = queue.shift();

      const run = () => {
        applyAction(side);

        // 마지막 화면까지 모두 끝나면 다른 시나리오로 이동하는 버튼을 보여줌
        if (SC.next && step >= MAX_STEP && queue.length === 0) {
          nextBtn.textContent = SC.next.label;
          setTimeout(() => { if (step >= MAX_STEP && queue.length === 0) nextBtn.hidden = false; }, 700);
        }
      };

      // 받는 쪽(아래)이 처음 움직일 때: 보내는 쪽 폰에서 사진이 튀어나와 받는 쪽 프레임으로 들어간 뒤에 화면 전환
      if (side === "bottom" && SC.sendPhoto && step === SC.sendStep) {
        playSendPhoto(run);
      } else {
        run();
      }
    });

    /* 사진이 위쪽 폰의 G 프로필에서 천천히 튀어나와 아래쪽 폰 "뒤로" 들어가는 연출 */
    let effectBusy = false;
    const flights = new Set();

    /* 보내는 쪽 폰에서 튀어나와 받는 쪽 폰 "뒤로" 들어가는 비행 연출 (Quick Share 사진, Smart Switch 데이터 아이콘 공용)
       fromRect: 출발 위치(화면 좌표 rect), size: 크기(px), duration: ms, decorate(node): 내용 꾸미기, onDone: 끝까지 날았을 때 호출, stream: 연속 전송용 표시 */
    function launchFlyer({ fromRect, size, duration, decorate, onDone, stream = false }){
      const layer = el("qrScanLayer");
      const layerRect = layer.getBoundingClientRect();
      const targetFrame = panelBottom.querySelector(".ss-frame");
      const toRect = targetFrame.getBoundingClientRect();

      const sx = fromRect.left - layerRect.left + fromRect.width / 2;
      const sy = fromRect.top - layerRect.top + fromRect.height / 2;
      const tx = toRect.left - layerRect.left + toRect.width / 2;
      const ty = toRect.top - layerRect.top + toRect.height / 2;

      const node = document.createElement("div");
      node.className = "ss-flyer";
      node.style.width = node.style.height = size + "px";
      node.style.left = (sx - size / 2) + "px";
      node.style.top = (sy - size / 2) + "px";
      decorate(node);
      layer.appendChild(node);

      // 받는 쪽 폰 복제본을 같은 위치·크기로 위에 얹어서, 날아가는 것이 폰 "뒤로" 들어가는 것처럼 가려지게 함
      const cover = targetFrame.cloneNode(true);
      cover.querySelectorAll("[id]").forEach((n) => n.removeAttribute("id"));
      cover.classList.add("qr-flying-frame");
      cover.style.transformOrigin = "0 0";
      cover.style.left = (toRect.left - layerRect.left) + "px";
      cover.style.top = (toRect.top - layerRect.top) + "px";
      cover.style.transform = `scale(${toRect.width / targetFrame.offsetWidth})`;
      layer.appendChild(cover);

      const flight = { stream };
      let finished = false;
      const end = (completed) => {
        if (finished) return;
        finished = true;
        node.remove();
        cover.remove();
        flights.delete(flight);
        if (completed && onDone) onDone();
      };
      flight.cancel = () => end(false);
      flights.add(flight);

      const dx = tx - sx, dy = ty - sy;
      const anim = node.animate([
        { transform: "translate(0px, 0px) scale(0.3)", opacity: 0, offset: 0, easing: "ease-out" },
        // 튀어나옴: 살짝 위로 솟으며 커짐
        { transform: "translate(0px, -16px) scale(1.2)", opacity: 1, offset: 0.14, easing: "ease-in-out" },
        { transform: "translate(0px, -10px) scale(1)", opacity: 1, offset: 0.28, easing: "ease-in-out" },
        // 받는 쪽 폰 위쪽 가장자리까지 이동
        { transform: `translate(${dx}px, ${dy - toRect.height * 0.55}px) scale(0.9)`, opacity: 1, offset: 0.62, easing: "ease-in-out" },
        // 폰 뒤로 미끄러져 들어감 (복제본에 가려짐)
        { transform: `translate(${dx}px, ${dy}px) scale(0.7)`, opacity: 1, offset: 0.86 },
        { transform: `translate(${dx}px, ${dy}px) scale(0.7)`, opacity: 0, offset: 1 },
      ], { duration, easing: "linear" });
      anim.onfinish = () => end(true);
      setTimeout(() => end(true), duration + 200); // 안전장치: 애니메이션 이벤트가 안 와도 진행이 멈추지 않게 함
      return flight;
    }

    function cancelFlights(streamOnly = false){
      [...flights].forEach((f) => { if (!streamOnly || f.stream) f.cancel(); });
    }

    /* Quick Share: 사진이 위쪽 폰의 G 프로필에서 천천히 튀어나와 아래쪽 폰 뒤로 들어감 */
    function playSendPhoto(done){
      const fromRect = (!hotspotTop.hidden ? hotspotTop : panelTop.querySelector(".ss-frame")).getBoundingClientRect();
      hideHotspots(); // 사진이 튀어나오는 자리의 파란 원은 숨김
      effectBusy = true;
      launchFlyer({
        fromRect,
        size: 56,
        duration: 3000,
        decorate: (node) => {
          node.classList.add("qs-flying-photo");
          node.style.backgroundImage = `url("${SC.sendPhoto}")`;
        },
        onDone: () => { effectBusy = false; done(); },
      });
    }

    function startScenario(key){
      applyScenario(key);
      resetSplitview();
      showScreen("screen-splitview");
      if (SC.intro) playIntro();   // intro가 없는 시나리오(Quick Share)는 처음부터 위/아래로 분리된 상태로 시작
    }

    // 홈의 카드에 따라 진입 시나리오 결정: exp4.html = Smart Switch(iPhone to Galaxy), exp4.html?s=qs = Quick Share
    const ENTRY = new URLSearchParams(location.search).get("s") === "qs" ? "qsg2i" : "i2g";
    if (ENTRY === "qsg2i") {
      document.title = "Quick Share | Try Galaxy Demo";
      document.querySelector("#screen-intro h1").textContent = "Quick Share";
      document.querySelector("#screen-intro .hint").textContent = "Tap the screen to step through Quick Share, sending a photo from Galaxy to iOS.";
    }

    el("startBtn").onclick = () => startScenario(ENTRY);

    // Secret switch: 5 consecutive taps (each within 1.5s of the last) toggles iOS to Galaxy <-> Galaxy to Galaxy
    let secretTaps = 0, secretTimer = null;
    nextBtn.onclick = (e) => {
      e.stopPropagation();
      secretTaps += 1;
      clearTimeout(secretTimer);
      secretTimer = setTimeout(() => { secretTaps = 0; }, 1500);
      if (secretTaps >= 5) {
        secretTaps = 0;
        startScenario(SC.next.key);
      }
    };

    el("closeSplitBtn").onclick = (e) => {
      e.stopPropagation();
      cancelIntro();
      nextBtn.hidden = true;
      showScreen("screen-intro");
    };

    /* 경계선 핸들 드래그 — 탭 흐름과 별개로 두 패널 비율을 자유롭게 조절 */
    const resizeHandle = el("ssResizeHandle");

    resizeHandle.addEventListener("click", (e) => e.stopPropagation());

    resizeHandle.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      resizeHandle.setPointerCapture(e.pointerId);
      stage.classList.add("is-dragging");

      const onMove = (ev) => {
        const stageRect = stage.getBoundingClientRect();
        const percent = ((ev.clientY - stageRect.top) / stageRect.height) * 100;
        const applied = setSplitRatio(percent);
        applyDragVisual(applied);
      };
      const onUp = (ev) => {
        stage.classList.remove("is-dragging");
        resizeHandle.releasePointerCapture(e.pointerId);
        resizeHandle.removeEventListener("pointermove", onMove);
        resizeHandle.removeEventListener("pointerup", onUp);
      };
      resizeHandle.addEventListener("pointermove", onMove);
      resizeHandle.addEventListener("pointerup", onUp);
    });
  </script>
</body>
</html>
